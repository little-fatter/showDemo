<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,shrink-to-fit=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#333333">
    <meta name="description" content="easy-to-use Scorer">
    <title>wScorer</title>
    <link href="./wScore.css" rel="stylesheet">
</head>

<body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root">
        <div class="App">
            <div class="Room">
                <div class="Share">
                    <h1><strong>wScorer</strong></h1>
                </div>
                <div class="SiteNotification">
                    <p>Reduced version for internal use.</p>
                    <p style="color: red;">
                        <b>Note: Do not duplicate names</b>
                    </p>
                </div>
                <div class="Join">
                    <form id="enrollForm">
                        <input type="text" name="myName" placeholder="type in your name" required="" />
                        to
                        <button type="submit" disabled>Play</button>
                    </form>
                </div>
                <div class="Actions">
                    <ul class="scores">
                        <li><button class="" value="0">0</button></li>
                        <li><button class="" value="½">½</button></li>
                        <li><button class="" value="1">1</button></li>
                        <li><button class="" value="2">2</button></li>
                        <li><button class="" value="3">3</button></li>
                        <li><button class="" value="5">5</button></li>
                        <li><button class="" value="8">8</button></li>
                        <li><button class="" value="13">13</button></li>
                        <li><button class="" value="20">20</button></li>
                        <li><button class="" value="40">40</button></li>
                        <li><button class="" value="100">100</button></li>
                        <li><button class="" value="❓">❓</button></li>
                        <li><button class="" value="🐞">🐞</button></li>
                        <li><button class="" value="☕">☕</button></li>
                    </ul>
                    <ul class="operations">
                        <li>
                            <button id="showScore">Show</button>
                            <button id="cleanScore" class="danger">Clear</button>
                        </li>
                    </ul>
                </div>
                <div class="Votes">
                </div>
            </div>
        </div>
    </div>
    <script src="./wScore.js"></script>
</body>

</html>
